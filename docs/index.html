const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(senha){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(P.s),iterations:P.it,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
async function tentar(senha,silencioso){
  const bt=document.getElementById('bt');bt.disabled=true;bt.textContent='Abrindo…';
  try{
    const html=await abrir(senha);
    localStorage.setItem('estrela_painel_senha',senha);
    document.open();document.write(html);document.close();
  }catch(e){
    bt.disabled=false;bt.textContent='Abrir painel';
    if(!silencioso){document.getElementById('err').style.display='block';}
  }
}
document.getElementById('f').addEventListener('submit',ev=>{
  ev.preventDefault();tentar(document.getElementById('pw').value,false);});
const salva=localStorage.getItem('estrela_painel_senha');
if(salva)tentar(salva,true);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
