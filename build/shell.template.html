<!DOCTYPE html>
<!-- ============================================
 grupo-humanidade / hub comercial / gestao / estrela
 Gerado em: __GERADO_EM__
 Painel Vendas x Estoque (Estrela Urbanidade) com dados criptografados
 (AES-256-GCM + PBKDF2-SHA256). A senha nao esta neste arquivo.
 Para atualizar: exportar o painel aberto do Cowork e rodar
 build/encrypt_painel.py localmente. Ver build/README.md.
 ============================================ -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icone-eu-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estrela">
<title>Hub Comercial — acesso restrito</title>
<style>
html{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 80% -10%,#12253c 0%,#0b1220 55%) fixed;
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#eef4fa}
.box{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
  border-radius:18px;backdrop-filter:blur(8px);padding:32px 34px;
  max-width:360px;width:90%;text-align:center;box-shadow:0 10px 34px rgba(0,0,0,.35)}
h1{font-size:17px;margin:0 0 6px;letter-spacing:.01em}
p{font-size:13px;color:#64778f;margin:0 0 18px}
input{width:100%;box-sizing:border-box;padding:11px 12px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#eef4fa;
  border-radius:9px;font-size:15px;margin-bottom:12px;text-align:center;outline:none}
input:focus{border-color:rgba(103,207,232,.5)}
button{width:100%;padding:11px;border:none;border-radius:9px;background:#0e9fc4;
  color:#04121a;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#f87171;font-size:13px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="box">
  <h1>Hub Comercial</h1>
  <p>Estrela Urbanidade · acesso restrito à gestão. Digite a senha para abrir o painel.</p>
  <form id="f">
    <input type="password" id="pw" placeholder="Senha" autocomplete="current-password" autofocus>
    <button type="submit" id="bt">Abrir painel</button>
  </form>
  <div class="err" id="err">Senha incorreta.</div>
</div>
<script>
const P=__PAYLOAD__;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(senha){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(P.s),iterations:P.it,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(pt);
}
async function tentar(senha,silencioso){
  const bt=document.getElementById('bt');bt.disabled=true;bt.textContent='Abrindo…';
  try{
    const html=await abrir(senha);
    localStorage.setItem('estrela_painel_senha',senha);
    document.open();document.write(html);document.close();
  }catch(e){
    bt.disabled=false;bt.textContent='Abrir painel';
    if(!silencioso){document.getElementById('err').style.display='block';}
  }
}
document.getElementById('f').addEventListener('submit',ev=>{
  ev.preventDefault();tentar(document.getElementById('pw').value,false);});
const salva=localStorage.getItem('estrela_painel_senha');
if(salva)tentar(salva,true);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body>
</html>
